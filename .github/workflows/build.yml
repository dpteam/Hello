name: build

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  linux:
    name: Linux (GCC)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Установить зависимости
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake ninja-build \
              libsdl2-dev libsdl2-ttf-dev

      - name: Настроить
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Debug \
            -DHELLO_WERROR=ON

      - name: Собрать
        run: cmake --build build

      - name: Тесты
        run: ctest --test-dir build --output-on-failure

      # На Linux бинарник консольный, поэтому здесь можно реально
      # запустить его headless: dummy-драйвер не требует дисплея,
      # но проходит всю инициализацию SDL, рендеринг и сохранение кадра.
      - name: Дымовой тест (headless)
        run: |
          set -euo pipefail
          cd build
          ./hello --version
          SDL_VIDEODRIVER=dummy ./hello --screenshot smoke.bmp --theme green
          test -s smoke.bmp
          echo "OK: $(stat -c%s smoke.bmp) байт"

  windows:
    name: Windows (MSYS2 UCRT64)
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4

      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-ninja
            mingw-w64-ucrt-x86_64-SDL2
            mingw-w64-ucrt-x86_64-SDL2_ttf

      - name: Настроить
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DHELLO_WERROR=ON

      - name: Собрать
        run: cmake --build build

      - name: Тесты
        run: ctest --test-dir build --output-on-failure

      # Без этих DLL hello.exe запустится только там, где стоит MSYS2.
      # Набор не хардкодится: ldd показывает полный транзитивный список,
      # а всё, что резолвится в /ucrt64/bin, — это наши зависимости.
      # Системные DLL из C:/Windows копировать не нужно.
      - name: Собрать портативный дистрибутив
        run: |
          set -euo pipefail
          mkdir -p dist/assets/fonts

          cp README.md LICENSE dist/
          cp docs/BUILD.md dist/
          cp assets/fonts/DejaVuSansMono-Bold.ttf dist/assets/fonts/
          cp assets/fonts/LICENSE dist/assets/fonts/LICENSE
          cp assets/fonts/AUTHORS dist/assets/fonts/AUTHORS
          cp build/hello.exe dist/

          ldd build/hello.exe | awk '/=> \/ucrt64\/bin\// {print $3}' | sort -u > dlls.txt
          if [ ! -s dlls.txt ]; then
            echo "ОШИБКА: ldd не нашёл ни одной зависимости"
            exit 1
          fi

          while read -r dll; do
            cp "$dll" dist/
          done < dlls.txt

          count=$(wc -l < dlls.txt)
          echo "Скопировано DLL: $count"

          if ldd build/hello.exe | grep -qi "not found"; then
            echo "ОШИБКА: есть неразрешённые зависимости"
            ldd build/hello.exe | grep -i "not found"
            exit 1
          fi

          echo "--- содержимое dist ---"
          ls -lh dist/

      # Проверка полноты DLL — статическая: разбираем таблицы импорта,
      # а не запускаем GUI-бинарник. Запуск GUI-приложения на раннере
      # ненадёжен (подсистема WINDOWS, нет интерактивного рабочего стола),
      # а импорты проверяются детерминированно и мгновенно.
      - name: Проверить полноту DLL
        timeout-minutes: 2
        run: |
          set -euo pipefail
          python tools/collect_dlls.py --check dist
          echo "Все несистемные зависимости на месте"

      # Диагностика: пробуем запустить, но не валим сборку, если
      # раннер не может создать окно. Полнота DLL уже проверена выше,
      # а работоспособность кода — дымовым тестом на Linux.
      - name: Запуск (диагностика)
        timeout-minutes: 2
        continue-on-error: true
        shell: cmd
        run: |
          set "PATH=%SystemRoot%\System32;%SystemRoot%"
          set SDL_VIDEODRIVER=dummy
          cd dist
          echo --- version ---
          hello.exe --version
          echo errorlevel=%ERRORLEVEL%
          echo --- screenshot ---
          hello.exe --screenshot smoke.bmp --theme green
          echo errorlevel=%ERRORLEVEL%
          if exist smoke.bmp (echo OK: smoke.bmp есть) else (echo нет smoke.bmp)

      - name: Артефакт
        uses: actions/upload-artifact@v4
        with:
          name: hello-windows-x64
          path: dist/
          if-no-files-found: error

  macos:
    name: macOS (Clang)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Установить зависимости
        run: brew install cmake sdl2 sdl2_ttf

      - name: Настроить
        run: |
          cmake -S . -B build \
            -DCMAKE_BUILD_TYPE=Debug \
            -DHELLO_WERROR=ON \
            -DCMAKE_PREFIX_PATH="$(brew --prefix sdl2);$(brew --prefix sdl2_ttf)"

      - name: Собрать
        run: cmake --build build -j"$(sysctl -n hw.ncpu)"

      - name: Тесты
        run: ctest --test-dir build --output-on-failure
