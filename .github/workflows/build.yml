name: build

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  linux:
    name: Linux (GCC)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Установить зависимости
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake ninja-build \
              libsdl3-dev libsdl3-ttf-dev

      - name: Настроить
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Debug \
            -DHELLO_WERROR=ON

      - name: Собрать
        run: cmake --build build

      - name: Тесты
        run: ctest --test-dir build --output-on-failure

      # На Linux бинарник консольный, поэтому здесь можно реально
      # запустить его headless: dummy-драйвер не требует дисплея,
      # но проходит всю инициализацию SDL, рендеринг и сохранение кадра.
      - name: Дымовой тест (headless)
        run: |
          set -euo pipefail
          cd build
          ./hello --version
          SDL_VIDEODRIVER=dummy ./hello --screenshot smoke.bmp --theme green
          test -s smoke.bmp
          echo "OK: $(stat -c%s smoke.bmp) байт"

  windows:
    name: Windows (MSYS2 UCRT64)
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4

      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-ninja
            mingw-w64-ucrt-x86_64-sdl3
            mingw-w64-ucrt-x86_64-sdl3-ttf

      - name: Настроить
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DHELLO_WERROR=ON

      - name: Собрать
        run: cmake --build build

      - name: Тесты
        run: ctest --test-dir build --output-on-failure

      # Без этих DLL hello.exe запустится только там, где стоит MSYS2.
      #
      # tools/collect_dlls.py обходит зависимости рекурсивно и знает
      # про библиотеки-прослойки. Это важно: MSYS2 отдаёт SDL2 как
      # sdl2-compat, который грузит SDL3.dll через LoadLibrary.
      # Ни ldd, ни разбор таблицы импорта такого не видят, и без
      # SDL3.dll приложение падает с «Failed loading SDL3 library».
      - name: Собрать портативный дистрибутив
        run: |
          set -euo pipefail
          export MSYSTEM_PREFIX=/ucrt64
          mkdir -p dist/assets/fonts

          cp README.md LICENSE dist/
          cp docs/BUILD.md dist/
          cp assets/fonts/DejaVuSansMono-Bold.ttf dist/assets/fonts/
          cp assets/fonts/LICENSE dist/assets/fonts/LICENSE
          cp assets/fonts/AUTHORS dist/assets/fonts/AUTHORS

          python tools/collect_dlls.py build/hello.exe dist

          echo "--- содержимое dist ---"
          ls -lh dist/

      # Проверка полноты DLL — статическая: разбираем таблицы импорта
      # и требования прослоек, а не запускаем GUI-бинарник.
      #
      # Почему не запускаем: hello.exe — GUI-подсистема, и на раннере
      # без интерактивного рабочего стола процесс не завершается
      # (проверено: --version висит до таймаута, локально тот же
      # бинарник с тем же чистым PATH отвечает мгновенно).
      # Работоспособность кода проверяется дымовым тестом на Linux.
      - name: Проверить полноту DLL
        timeout-minutes: 2
        run: |
          set -euo pipefail
          export MSYSTEM_PREFIX=/ucrt64
          python tools/collect_dlls.py --check dist
          echo "Все несистемные зависимости на месте"

      # Настоящий запуск, а не только статическая проверка.
      #
      # hello.exe — GUI-подсистема, поэтому ждать её завершения нельзя:
      # на раннере без рабочего стола процесс может не выйти сам.
      # Запускаем с таймаутом и судим по результату: --screenshot
      # пишет BMP до выхода. Если какой-то DLL не хватает, файла
      # не будет — ровно так пропускался SDL3.dll для sdl2-compat.
      - name: Дымовой тест (запуск с таймаутом)
        timeout-minutes: 3
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $env:PATH = "$env:SystemRoot\System32;$env:SystemRoot"
          $env:SDL_VIDEODRIVER = 'dummy'
          Set-Location dist
          Remove-Item smoke.bmp -ErrorAction SilentlyContinue

          $p = Start-Process -FilePath '.\hello.exe' `
                 -ArgumentList '--screenshot','smoke.bmp','--theme','green' `
                 -PassThru -NoNewWindow

          if (-not $p.WaitForExit(60000)) {
            Write-Host 'процесс не завершился за минуту — убиваем'
            $p.Kill()
          }
          Write-Host ("exit code: " + $p.ExitCode)

          if (-not (Test-Path smoke.bmp)) {
            Write-Error 'ОШИБКА: smoke.bmp не создан — вероятно, не хватает DLL'
            exit 1
          }
          $size = (Get-Item smoke.bmp).Length
          Write-Host ("OK: smoke.bmp " + $size + " байт")
          if ($size -lt 1000) {
            Write-Error 'ОШИБКА: файл подозрительно мал'
            exit 1
          }
          Remove-Item smoke.bmp

      - name: Артефакт
        uses: actions/upload-artifact@v4
        with:
          name: hello-windows-x64
          path: dist/
          if-no-files-found: error

  macos:
    name: macOS (Clang)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Установить зависимости
        run: brew install cmake sdl3 sdl3_ttf

      - name: Настроить
        run: |
          cmake -S . -B build \
            -DCMAKE_BUILD_TYPE=Debug \
            -DHELLO_WERROR=ON \
            -DCMAKE_PREFIX_PATH="$(brew --prefix sdl3);$(brew --prefix sdl3_ttf)"

      - name: Собрать
        run: cmake --build build -j"$(sysctl -n hw.ncpu)"

      - name: Тесты
        run: ctest --test-dir build --output-on-failure
