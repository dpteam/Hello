name: build

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  linux:
    name: Linux (GCC)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Установить зависимости
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake ninja-build \
              libsdl2-dev libsdl2-ttf-dev

      - name: Настроить
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Debug \
            -DHELLO_WERROR=ON

      - name: Собрать
        run: cmake --build build

      - name: Тесты
        run: ctest --test-dir build --output-on-failure

  windows:
    name: Windows (MSYS2 UCRT64)
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4

      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-ninja
            mingw-w64-ucrt-x86_64-SDL2
            mingw-w64-ucrt-x86_64-SDL2_ttf

      - name: Настроить
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DHELLO_WERROR=ON

      - name: Собрать
        run: cmake --build build

      - name: Тесты
        run: ctest --test-dir build --output-on-failure

      # Без этих DLL hello.exe запустится только там, где стоит MSYS2.
      # Набор вычисляется по таблицам импорта, а не хардкодится:
      # tools/collect_dlls.py обходит зависимости рекурсивно.
      - name: Собрать портативный дистрибутив
        run: |
          set -euo pipefail
          export MSYSTEM_PREFIX=/ucrt64
          mkdir -p dist

          cp README.md LICENSE dist/
          cp docs/BUILD.md dist/
          cp assets/fonts/DejaVuSansMono-Bold.ttf dist/
          cp assets/fonts/LICENSE dist/DejaVu-LICENSE
          cp assets/fonts/AUTHORS dist/DejaVu-AUTHORS

          python tools/collect_dlls.py build/hello.exe dist

          echo "--- содержимое dist ---"
          ls -lh dist/

      # Проверяем именно чистый PATH: если MSYS2 в нём есть, ошибка
      # «не хватает DLL» останется незамеченной.
      - name: Проверить дистрибутив без MSYS2 в PATH
        shell: cmd
        run: |
          set "PATH=%SystemRoot%\System32;%SystemRoot%"
          cd dist
          hello.exe --version
          if errorlevel 1 exit /b 1
          hello.exe --screenshot smoke.bmp --theme green
          if errorlevel 1 exit /b 1
          if not exist smoke.bmp (
            echo ОШИБКА: скриншот не создан
            exit /b 1
          )
          del smoke.bmp
          echo ОК: бинарник работает без MSYS2 в PATH

      - name: Артефакт
        uses: actions/upload-artifact@v4
        with:
          name: hello-windows-x64
          path: dist/
          if-no-files-found: error

  macos:
    name: macOS (Clang)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Установить зависимости
        run: brew install cmake sdl2 sdl2_ttf

      - name: Настроить
        run: |
          cmake -S . -B build \
            -DCMAKE_BUILD_TYPE=Debug \
            -DHELLO_WERROR=ON \
            -DCMAKE_PREFIX_PATH="$(brew --prefix sdl2);$(brew --prefix sdl2_ttf)"

      - name: Собрать
        run: cmake --build build -j"$(sysctl -n hw.ncpu)"

      - name: Тесты
        run: ctest --test-dir build --output-on-failure
